name: Apply final adversarial fixes

on:
  push:
    branches:
      - agent/reinforce-research-assurance
    paths:
      - ".github/workflows/apply-final-adversarial-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reinforce-research-assurance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed fixes
        env:
          PATCH_PAYLOAD: ""
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          code = gzip.decompress(base64.b64decode(os.environ["PATCH_PAYLOAD"])).decode("utf-8")
          exec(compile(code, "apply_remaining.py", "exec"), {"__name__": "__main__"})
          PY
      - name: Compile changed Python entrypoints
        run: |
          python -m py_compile \
            research/research-pipeline-planner/scripts/harness_runtime.py \
            research/research-pipeline-planner/scripts/init_research_pack.py \
            research/research-pipeline-planner/scripts/validate_research_pack.py \
            research/research-experiment-plan/scripts/validate_experiment_pack.py
      - name: Run harness runtime tests
        run: python -m unittest discover -s research/research-pipeline-planner/tests -p 'test_harness_runtime.py' -v
      - name: Run research-pack tests
        run: python -m unittest discover -s research/research-pipeline-planner/tests -p 'test_research_pack.py' -v
      - name: Run experiment assurance tests
        run: python -m unittest discover -s research/research-experiment-plan/tests -p 'test_validate_experiment_pack.py' -v
      - name: Commit fixes
        run: |
          rm .github/workflows/apply-final-adversarial-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/research-assurance.yml \
            research/research-pipeline-planner/SKILL.md \
            research/research-pipeline-planner/references/agentic-harness-contract.md \
            research/research-pipeline-planner/scripts/harness_runtime.py \
            research/research-pipeline-planner/scripts/validate_research_pack.py \
            research/research-pipeline-planner/tests/test_harness_runtime.py \
            research/research-pipeline-planner/tests/test_research_pack.py \
            research/research-experiment-plan/scripts/validate_experiment_pack.py \
            research/research-experiment-plan/tests/test_validate_experiment_pack.py \
            .github/workflows/apply-final-adversarial-fixes.yml
          git diff --cached --check
          git commit -m "Close final adversarial review findings"
          git push origin HEAD:agent/reinforce-research-assurance
