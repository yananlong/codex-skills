name: Research assurance regression tests

on:
  pull_request:
    paths:
      - "research/research-pipeline-planner/**"
      - "research/research-systematic-literature-review/**"
      - "research/research-experiment-plan/**"
      - "research/research-idea-discovery/**"
      - "research/research-novelty-review/**"
      - "research/research-results-auditor/**"
      - "research/research-review-loop/**"
      - "documents/adversarial-doc-review/**"
      - ".github/workflows/research-assurance.yml"
  push:
    branches: [main]
    paths:
      - "research/research-pipeline-planner/**"
      - "research/research-systematic-literature-review/**"
      - "research/research-experiment-plan/**"
      - "research/research-idea-discovery/**"
      - "research/research-novelty-review/**"
      - "research/research-results-auditor/**"
      - "research/research-review-loop/**"
      - "documents/adversarial-doc-review/**"
      - ".github/workflows/research-assurance.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile changed Python entrypoints
        run: |
          python -m py_compile \
            research/research-pipeline-planner/scripts/harness_runtime.py \
            research/research-pipeline-planner/scripts/init_research_pack.py \
            research/research-pipeline-planner/scripts/validate_research_pack.py \
            research/research-pipeline-planner/scripts/init_research_commitment.py \
            research/research-pipeline-planner/scripts/validate_research_commitment.py \
            research/research-systematic-literature-review/scripts/init_review_pack.py \
            research/research-systematic-literature-review/scripts/validate_review_pack.py \
            research/research-experiment-plan/scripts/init_experiment_pack.py \
            research/research-experiment-plan/scripts/validate_experiment_pack.py
      - name: Run harness runtime tests
        run: python -m unittest discover -s research/research-pipeline-planner/tests -p 'test_harness_runtime.py' -v
      - name: Run experiment runtime tests
        run: python -m unittest discover -s research/research-pipeline-planner/tests -p 'test_experiment_runtime.py' -v
      - name: Run experiment pack integration tests
        run: python -m unittest discover -s research/research-pipeline-planner/tests -p 'test_experiment_pack_integration.py' -v
      - name: Run research-pack tests
        run: python -m unittest discover -s research/research-pipeline-planner/tests -p 'test_research_pack.py' -v
      - name: Run research-commitment tests
        run: python -m unittest discover -s research/research-pipeline-planner/tests -p 'test_research_commitment.py' -v
      - name: Run literature recall-assurance tests
        run: python -m unittest discover -s research/research-systematic-literature-review/tests -p 'test_review_pack.py' -v
      - name: Run experiment assurance tests
        run: python -m unittest discover -s research/research-experiment-plan/tests -p 'test_validate_experiment_pack.py' -v
      # Archives are release artifacts; generated Python bytecode is forbidden.
      - name: Archive changed skills
        run: |
          mkdir -p packaged-skills
          package_skill() {
            source_dir="$1"
            skill_name="$2"
            parent_dir="$(dirname "$source_dir")"
            base_name="$(basename "$source_dir")"
            (
              cd "$parent_dir"
              zip -qr "$GITHUB_WORKSPACE/packaged-skills/${skill_name}.zip" "$base_name" \
                -x "*/__pycache__/*" "*.pyc" "*.pyo"
            )
          }
          package_skill documents/adversarial-doc-review adversarial-doc-review
          package_skill research/research-experiment-plan research-experiment-plan
          package_skill research/research-idea-discovery research-idea-discovery
          package_skill research/research-novelty-review research-novelty-review
          package_skill research/research-pipeline-planner research-pipeline-planner
          package_skill research/research-results-auditor research-results-auditor
          package_skill research/research-review-loop research-review-loop
          package_skill research/research-systematic-literature-review research-systematic-literature-review

          for archive in packaged-skills/*.zip; do
            if unzip -Z1 "$archive" | grep -Eq '(^|/)__pycache__/|\.py[co]$'; then
              echo "::error file=$archive::archive contains generated Python bytecode"
              exit 1
            fi
          done
      - name: Upload changed skill packages
        uses: actions/upload-artifact@v4
        with:
          name: changed-skills
          path: packaged-skills/*.zip
          if-no-files-found: error
