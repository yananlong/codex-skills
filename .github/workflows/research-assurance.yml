name: Research assurance regression tests

on:
  pull_request:
    paths:
      - "research/**"
      - "writing/**"
      - "documents/adversarial-doc-review/**"
      - ".github/workflows/research-assurance.yml"
  push:
    branches: [main]
    paths:
      - "research/**"
      - "writing/**"
      - "documents/adversarial-doc-review/**"
      - ".github/workflows/research-assurance.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every skill script
        run: |
          find research documents writing -path '*/scripts/*' -name '*.py' -not -path '*/__pycache__/*' -print0 \
            | xargs -0 python -m py_compile
      - name: Run every skill test suite
        run: |
          status=0
          for tests_dir in $(find research documents writing -type d -name tests -not -path '*/__pycache__/*' | sort); do
            echo "::group::$tests_dir"
            if ! python -m unittest discover -s "$tests_dir" -p 'test_*.py' -v; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile every skill script under the oldest supported Python
        run: |
          find research documents writing -path '*/scripts/*' -name '*.py' -not -path '*/__pycache__/*' -print0 \
            | xargs -0 python3.11 -m py_compile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Standalone novelty-review install must work without the literature-review sibling
        run: |
          tmp="$(mktemp -d)"
          cp -R research/research-novelty-review "$tmp/"
          python "$tmp/research-novelty-review/scripts/validate_novelty_pack.py" --help
      - name: Validate Study 001 draft pack
        run: |
          python research/research-pipeline-planner/scripts/validate_prospective_evaluation.py \
            --protocol research/research-pipeline-planner/prospective-studies/study-001-category-theory/prospective-protocol.json \
            --observations research/research-pipeline-planner/prospective-studies/study-001-category-theory/prospective-observations.json \
            --summary research/research-pipeline-planner/prospective-studies/study-001-category-theory/prospective-summary.json \
            --assurance-profile structural
      # Archives are release artifacts; generated Python bytecode is forbidden.
      - name: Archive changed skills
        run: |
          mkdir -p packaged-skills
          package_skill() {
            source_dir="$1"
            skill_name="$2"
            parent_dir="$(dirname "$source_dir")"
            base_name="$(basename "$source_dir")"
            (
              cd "$parent_dir"
              zip -qr "$GITHUB_WORKSPACE/packaged-skills/${skill_name}.zip" "$base_name" \
                -x "*/__pycache__/*" "*.pyc" "*.pyo" "*/tests/*"
            )
          }
          package_skill documents/adversarial-doc-review adversarial-doc-review
          for skill_dir in research/*/; do
            skill_dir="${skill_dir%/}"
            package_skill "$skill_dir" "$(basename "$skill_dir")"
          done

          for archive in packaged-skills/*.zip; do
            if unzip -Z1 "$archive" | grep -Eq '(^|/)__pycache__/|\.py[co]$'; then
              echo "::error file=$archive::archive contains generated Python bytecode"
              exit 1
            fi
          done
      - name: Upload changed skill packages
        uses: actions/upload-artifact@v4
        with:
          name: changed-skills
          path: packaged-skills/*.zip
          if-no-files-found: error
