name: Skill catalog regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run catalog regression tests
        run: python -m unittest discover -s scripts/tests -p 'test_skill_catalog.py' -v
      - name: Check committed catalog against current sources
        run: python scripts/validate_skill_catalog.py
