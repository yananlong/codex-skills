name: PR24 catalog refresh

on:
  push:
    branches:
      - add-proportional-pdf-trimmer-20260827

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-proportional-pdf-trimmer-20260827
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate and validate skill catalog
        run: |
          python3 scripts/generate_skill_catalog.py
          python3 scripts/validate_skill_catalog.py
          git diff --check
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills-catalog.json skills-catalog.md
          if git diff --cached --quiet; then
            echo "Catalog already current"
            exit 0
          fi
          git commit -m "Refresh skill catalog"
          git push origin HEAD:add-proportional-pdf-trimmer-20260827
