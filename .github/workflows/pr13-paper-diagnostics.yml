name: PR13 paper validator diagnostics

on:
  pull_request:
    paths:
      - "research/research-paper-plan/**"
      - ".github/workflows/pr13-paper-diagnostics.yml"

permissions:
  contents: read

jobs:
  paper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile paper validator modules
        run: |
          python -m py_compile \
            research/research-paper-plan/scripts/init_paper_pack.py \
            research/research-paper-plan/scripts/paper_pack_common.py \
            research/research-paper-plan/scripts/paper_pack_views.py \
            research/research-paper-plan/scripts/paper_pack_linked.py \
            research/research-paper-plan/scripts/validate_paper_pack.py
      - name: Run paper tests with captured output
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s research/research-paper-plan/tests -p 'test_paper_pack.py' -v 2>&1 | tee paper-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr13-paper-test-diagnostics
          path: paper-test.log
          if-no-files-found: error
